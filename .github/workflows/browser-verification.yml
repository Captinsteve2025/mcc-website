name: Browser verification

# Runs Playwright against the configured site on demand and on a schedule.
# The health monitor imports results from the workflow.

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Test all four yachts (not just the sample)"
        type: boolean
        default: true
  schedule:
    # Daily at 07:10 UTC, after the site-health cron at 06:00.
    - cron: "10 7 * * *"

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://mcc-website-one.vercel.app' }}
      PLAYWRIGHT_FULL: ${{ github.event_name == 'schedule' && '1' || inputs.full && '1' || '' }}
      BROWSER_TESTS_IMPORT_URL: ${{ secrets.BROWSER_TESTS_IMPORT_URL || format('{0}/api/browser-tests', vars.PLAYWRIGHT_BASE_URL || 'https://mcc-website-one.vercel.app') }}
      BROWSER_TESTS_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Playwright
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:browser:live

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .playwright/live-report
          include-hidden-files: true
          retention-days: 14
