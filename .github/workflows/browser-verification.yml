name: Browser verification

# Runs the Playwright browser checks against the live production site after
# each deployment and imports the results into /admin/site-health. Results are
# imported, never executed, by the health monitor itself.

on:
  # Vercel's GitHub integration finishes the deployment from the push; wait a
  # fixed window instead of polling an API that needs extra permissions.
  workflow_dispatch:
    inputs:
      full:
        description: "Test all four yachts (not just the sample)"
        type: boolean
        default: true
  schedule:
    # Daily at 07:10 UTC, after the site-health cron at 06:00.
    - cron: "10 7 * * *"

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://mcc-website-one.vercel.app' }}
      PLAYWRIGHT_FULL: ${{ github.event_name == 'schedule' && '1' || inputs.full && '1' || '' }}
      BROWSER_TESTS_IMPORT_URL: ${{ secrets.BROWSER_TESTS_IMPORT_URL || format('{0}/api/browser-tests', vars.PLAYWRIGHT_BASE_URL || 'https://mcc-website-one.vercel.app') }}
      BROWSER_TESTS_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1
          npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npx playwright test tests/browser-verification.spec.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
